<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
    <title>News</title>
</head>

<body>


    <section id="filter" class="py-5 mx-auto overflow-hidden">
        <div class="container">
            <form action="">
                <div class="row">
                    <div class="col-lg-6">
                        <div class="item">
                            <div class="mb-3">
                                <label for="Category" class="form-label">Category</label>
                                <select name="category" id="Category" class="form-control">
                                    <option value="business" selected>Business</option>
                                    <option value="health">Health</option>
                                    <option value="science">Science</option>
                                    <option value="sports">Sports</option>
                                    <option value="technology">Technology</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="item">
                            <div class="mb-3">
                                <label for="Search" class="form-label">Search</label>
                                <input type="text" id="Search" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn  w-100 mt-3">Filter</button>
            </form>
        </div>
    </section>

    <section id="data" class=" py-5 mx-auto overflow-hidden">
        <div class="container">
            <div class="row ">

            </div>
            <nav aria-label="Page navigation example" class="mt-5  mx-auto " style=" overflow-x: scroll;">
                <ul class="pagination justify-content-center " style="width: fit-content;">
                </ul>
            </nav>
        </div>
    </section>



    <script src="./js/jquery.js"></script>
    <script src="./js/function.js"></script>
    <script src="./js/index.js"></script>

</body>

</html>
